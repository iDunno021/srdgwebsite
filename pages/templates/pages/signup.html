{% extends 'pages/base.html' %}
{% load static %}
{% block title %}Join Us | SRDG{% endblock %}
{% block head %}
    <link rel="stylesheet" href="{% static 'pages/styles/signup.css' %}">
{% endblock %}
{% block content %}
<div class="signup-page">
    <div class="signup-card">
        <div class="signup-header">
            <h1>Join Us</h1>
            <p>Become a member of SRDG</p>
        </div>
        <form class="signup-form" method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <input 
                type="text" 
                id="other-school-input" 
                name="other_school" 
                placeholder="Enter your school name"
            >
            <button type="submit">Sign Up</button>
        </form>
    </div>
</div>

<div class="signup-page" style="padding-top: 0;">
    <div class="signup-card">
        <div class="signup-header">
            <h1>Join our Staff</h1>
            <p>Apply to become a staff member of SRDG</p>
        </div>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSe7RDudLizrAd5tt-3ovwGGgrLOd0uYig8-tTcnWfuRlJLmwg/viewform?usp=dialog" target="_blank" rel="noopener noreferrer" class="staff-signup-btn">Apply now &rarr;</a>
    </div>
</div>
<script>

    const SCHOOLS_BY_REGION = {
        'auckland': ['AGS', 'STC', 'STK', 'BAR', 'EGGS', 'KC', 'GDC', 'selwyn', 'DIO', 'RGT', 'DIL', 'ACGP', 'ACGS', 'WBC', 'WGC', 'MAC', 'SDCC', 'GBHS', 'other'],
        'bayofplenty': ['other'],
        'canterbury': ['other'],
        'gisbourne': ['other'],
        'hawkesbay': ['other'],
        'manawatuwhanganui': ['other'],
        'marlborough': ['other'],
        'nelson': ['other'],
        'northland': ['other'],
        'otago': ['other'],
        'southland': ['other'],
        'taranaki': ['other'],
        'tasman': ['other'],
        'waikato': ['other'],
        'wellington': ['other'],
        'westcoast': ['other'],
    };
    const schoolSelect = document.getElementById('id_school');
    const otherInput = document.getElementById('other-school-input');

    const allOptions = Array.from(schoolSelect.options);
    const schoolP = schoolSelect.closest('p');
    const regionP = document.createElement('p');

    const regionLabel = document.createElement('label');
    regionLabel.textContent = 'Region:';
    regionLabel.htmlFor = 'id_region';

    const regionSelect = document.createElement('select');
    regionSelect.id   = 'id_region';
    regionSelect.name = 'region';

    const regionOptions = [
        ['', 'Select your region…'],
        ['auckland',    'Auckland'],
        ['bayofplenty',   'Bay of Plenty'],
        ['canterbury',   'Canterbury'],
        ['gisbourne',   'Gisbourne'],
        ['hawkesbay',   'Hawke\'s Bay'],
        ['manawatuwhanganui',   'Manawatū-Whanganui'],
        ['marlborough',   'Marlborough'],
        ['nelson',   'Nelson'],
        ['northland', 'Northland'],
        ['otago',   'Otago'],
        ['southland',   'Southland'],
        ['taranaki',   'Taranaki'],
        ['tasman',   'Tasman'],
        ['waikato',    'Waikato'],
        ['wellington',   'Wellington'],
        ['westcoast',   'West Coast'],

    ];

    regionOptions.forEach(([val, label]) => {
        const opt = new Option(label, val);
        regionSelect.appendChild(opt);
    });

    regionP.appendChild(regionLabel);
    regionP.appendChild(regionSelect);
    schoolP.before(regionP);

    schoolP.style.display = 'none';

    regionSelect.addEventListener('change', function () {
        const region = this.value;

        schoolSelect.innerHTML = '';

        if (!region) {
            schoolP.style.display = 'none';
            hideOtherInput();
            return;
        }

        const allowed = SCHOOLS_BY_REGION[region] || [];
        const filtered = allOptions.filter(o => allowed.includes(o.value));

        schoolSelect.appendChild(new Option('Select your school…', ''));
        filtered.forEach(o => schoolSelect.appendChild(o.cloneNode(true)));

        if (filtered.length === 1) {
            schoolSelect.value = filtered[0].value;
        }

        schoolP.style.display = '';
        showOther();
    });

    schoolP.appendChild(otherInput);

    function hideOtherInput() {
    otherInput.style.maxHeight = '0';
    otherInput.style.opacity = '0';
    setTimeout(() => { otherInput.style.display = 'none'; }, 300);
    }

    function showOther() {
        if (schoolSelect.value === 'other') {
            otherInput.style.display = 'block';
            setTimeout(() => {
                otherInput.style.maxHeight = '50px';
                otherInput.style.opacity = '1';
            }, 10);
        } else {
            hideOtherInput();
        }
    }
    
    schoolSelect.addEventListener('change', showOther);

    document.querySelector('form').addEventListener('submit', function (e) {
        if (!regionSelect.value) {
            e.preventDefault();
            regionSelect.classList.add('error');
            return;
        }
        if (!schoolSelect.value) {
            e.preventDefault();
            schoolSelect.classList.add('error');
            return;
        }
        if (schoolSelect.value === 'other' && !otherInput.value.trim()) {
            e.preventDefault();
            otherInput.classList.add('error');
            otherInput.placeholder = 'Please enter your school name.';
        }
    });

    otherInput.addEventListener('input', function () {
        otherInput.classList.remove('error');
        otherInput.placeholder = 'Enter your school name';
    });

    regionSelect.addEventListener('change', function () {
        regionSelect.classList.remove('error');
        schoolSelect.classList.remove('error');
    });

    showOther();
</script>
{% endblock %}
